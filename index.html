<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ovia — Ronny bygger websites</title>
    <meta
      name="description"
      content="Jeg hedder Ronny, jeg er 17 år og går i gymnasiet. Ved siden af skolen bygger jeg websites. Prisen aftaler vi fast efter et kort kald."
    />
    <meta name="theme-color" content="#f5f2ec" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:site_name" content="Ovia" />
    <meta property="og:title" content="Ovia — Ronny bygger websites" />
    <meta
      property="og:description"
      content="Jeg hedder Ronny, jeg er 17 år og går i gymnasiet. Ved siden af skolen bygger jeg websites. Prisen aftaler vi fast efter et kort kald."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- [MANGLER] OG-billede og domæne.
         og:url og og:image skal være ABSOLUTTE URL'er — derfor kan de ikke
         sættes, før domænet er kendt. Når det er på plads:
           1. læg et 1200×630 billede i public/og.jpg
           2. udkommentér de to linjer og indsæt domænet begge steder

    <meta property="og:url" content="https://DIT-DOMÆNE/" />
    <meta property="og:image" content="https://DIT-DOMÆNE/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap"
    />

    <!-- Hero-billedet preloades. type= gør, at browsere uden AVIF
         springer den over og henter WebP/JPEG via <picture> i stedet. -->
    <link
      rel="preload"
      as="image"
      href="/ronny.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <script>
      // Sættes før første maling, så hero-koreografien ikke venter på
      // React-hydrering — og så der ikke blinker noget indhold undervejs.
      //
      // Vagthund: svarer motion-koden ikke inden 2,5s, fjernes klassen igen,
      // og alt indhold står synligt. Indhold må aldrig være permanent
      // usynligt, fordi JS fejler eller er langsom.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js-motion')
        window.__oviaReady = function () {
          root.setAttribute('data-motion-ready', '1')
        }
        setTimeout(function () {
          if (!root.hasAttribute('data-motion-ready')) {
            root.classList.remove('js-motion')
          }
        }, 2500)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
