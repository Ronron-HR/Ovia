    <!-- Pladsholder: scripts/prerender.mjs indsætter forsidens strukturerede
         data (organisationLd i src/entry-server.jsx, bygget fra pricing.js)
         og fjerner den på de øvrige sider. -->
    <script type="application/ld+json">{}</script>

    <!-- Skrifterne ligger på egen server (public/fonts, @font-face i index.css).
         Ingen kald til Google Fonts: så sendes besøgendes IP-adresse ikke til
         tredjepart, og privatlivspolitikken kan med sandhed sige, at siden
         ikke deler noget med andre. crossorigin er påkrævet ved font-preload. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin.woff2" crossorigin />

    <script>
      // Sættes før første maling, så hero-koreografien ikke venter på
      // React-hydrering — og så der ikke blinker noget indhold undervejs.
      //
      // Vagthund: svarer motion-koden ikke inden 2,5s, fjernes klassen igen,
      // og alt indhold står synligt. Indhold må aldrig være permanent
      // usynligt, fordi JS fejler eller er langsom.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js-motion')
        window.__oviaSpecsReady = function () {
          root.setAttribute('data-motion-ready', '1')
        }

        // Direkte link til et senere trin i beregneren (fx ?…&trin=4): siden
        // er forudrenderet med trin 1, og ved hydrering skifter beregneren til
        // det rigtige trin og bliver højere. Indtil da holdes alt EFTER
        // beregneren ude af layoutet (index.css), så det ikke skubbes ned
        // (layoutskift). PriceCalculator fjerner markeringen, når trinnet er
        // vist; vagthunden herunder gør det senest efter 2,5s.
        var trin = /[?&]trin=(\d+)/.exec(location.search)
        if ((trin && Number(trin[1]) > 1) || /[?&]hjaelp=/.test(location.search)) root.setAttribute('data-calc-pending', '')

        setTimeout(function () {
          if (!root.hasAttribute('data-motion-ready')) {
            root.classList.remove('js-motion')
          }
          root.removeAttribute('data-calc-pending')
        }, 2500)
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
