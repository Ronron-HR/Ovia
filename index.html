    <!-- Kun oplysninger, der står på siden: navn, mail, telefon og by.
         Ingen ratings eller gadeadresse. Copenhagen Ease-feedbacken står som
         synlig tekst på siden og er bevidst ikke markeret som Review/rating. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "OviaSpecs",
        "url": "https://oviaspecs.com/",
        "image": "https://oviaspecs.com/og.jpg",
        "email": "ronnyhong723@gmail.com",
        "telephone": "+4553613699",
        "description": "Digital handyman for lokale virksomheder: hjemmesider, booking, integrationer, automatisering og online markedsføring.",
        "founder": { "@type": "Person", "name": "Ronny Hong" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hjortshøj",
          "postalCode": "8530",
          "addressCountry": "DK"
        },
        "areaServed": { "@type": "Country", "name": "Danmark" }
      }
    </script>

    <!-- Skrifterne ligger på egen server (public/fonts, @font-face i index.css).
         Ingen kald til Google Fonts: så sendes besøgendes IP-adresse ikke til
         tredjepart, og privatlivspolitikken kan med sandhed sige, at siden
         ikke deler noget med andre. crossorigin er påkrævet ved font-preload. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-sans-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin-400.woff2" crossorigin />

    <script>
      // Sættes før første maling, så hero-koreografien ikke venter på
      // React-hydrering — og så der ikke blinker noget indhold undervejs.
      //
      // Vagthund: svarer motion-koden ikke inden 2,5s, fjernes klassen igen,
      // og alt indhold står synligt. Indhold må aldrig være permanent
      // usynligt, fordi JS fejler eller er langsom.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js-motion')
        window.__oviaSpecsReady = function () {
          root.setAttribute('data-motion-ready', '1')
        }
        setTimeout(function () {
          if (!root.hasAttribute('data-motion-ready')) {
            root.classList.remove('js-motion')
          }
        }, 2500)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
