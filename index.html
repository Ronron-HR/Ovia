<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ovia — Websites, content og annoncer af Ronny</title>
    <meta
      name="description"
      content="Jeg hedder Ronny, jeg er 17 år og går i gymnasiet. Ved siden af skolen laver jeg websites, content og annoncer. Prisen aftaler vi fast efter et kort kald."
    />
    <meta name="theme-color" content="#f5f2ec" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="da_DK" />
    <meta property="og:site_name" content="Ovia" />
    <meta property="og:title" content="Ovia — Websites, content og annoncer af Ronny" />
    <meta
      property="og:description"
      content="Jeg hedder Ronny, jeg er 17 år og går i gymnasiet. Ved siden af skolen laver jeg websites, content og annoncer. Prisen aftaler vi fast efter et kort kald."
    />
    <meta name="twitter:card" content="summary" />

    <!-- [MANGLER] OG-billede og domæne.
         og:url og og:image skal være ABSOLUTTE URL'er — derfor kan de ikke
         sættes, før domænet er kendt. Når det er på plads:
           1. læg et 1200×630 billede i public/og.jpg
           2. udkommentér blokken, indsæt domænet, og fjern den
              twitter:card-linje ovenfor, der står som "summary"
           3. tilføj public/sitemap.xml og en Sitemap-linje i robots.txt

    <meta property="og:url" content="https://DIT-DOMÆNE/" />
    <meta property="og:image" content="https://DIT-DOMÆNE/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://DIT-DOMÆNE/" />
    -->

    <!-- Skrifterne ligger på egen server (public/fonts, @font-face i index.css).
         Ingen kald til Google Fonts: så sendes besøgendes IP-adresse ikke til
         tredjepart, og privatlivspolitikken kan med sandhed sige, at siden
         ikke deler noget med andre. crossorigin er påkrævet ved font-preload. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin />

    <!-- Hero-billedet preloades. type= gør, at browsere uden AVIF
         springer den over og henter WebP/JPEG via <picture> i stedet. -->
    <link
      rel="preload"
      as="image"
      href="/ronny.avif"
      type="image/avif"
      fetchpriority="high"
    />

    <script>
      // Sættes før første maling, så hero-koreografien ikke venter på
      // React-hydrering — og så der ikke blinker noget indhold undervejs.
      //
      // Vagthund: svarer motion-koden ikke inden 2,5s, fjernes klassen igen,
      // og alt indhold står synligt. Indhold må aldrig være permanent
      // usynligt, fordi JS fejler eller er langsom.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js-motion')
        window.__oviaReady = function () {
          root.setAttribute('data-motion-ready', '1')
        }
        setTimeout(function () {
          if (!root.hasAttribute('data-motion-ready')) {
            root.classList.remove('js-motion')
          }
        }, 2500)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>Ovia — Websites, content og annoncer</h1>
      <p>Jeg hedder Ronny og laver websites, content og annoncer til danske virksomheder. Skriv til ronnyhong723@gmail.com for et kort kald og en fast pris.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
